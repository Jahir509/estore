<div class="flex flex-wrap justify-evenly">
  @if(loading()) {
    <h2 class="text-2xl font-semibold text-gray-400">Loading...</h2>
  } @else if(products().length === 0) {
    <h2 class="text-center w-full mt-10 text-[50px] font-semibold text-gray-700">
      <p>
        <fa-icon [icon]="faBoxOpen" class="text-[1.5em]"></fa-icon>
        No products found.
      </p>
    </h2>
  } @else {
    @for(product of products(); track product.id) {
      <div class="mx-4 p-3 mt-4 mb-4 flex flex-col rounded-lg shadow-md">
        <div class="overflow-hidden rounded-md aspect-[3/4] bg-gray-100">
          @defer (on viewport) {
            <img
            class="rounded-md mx-auto transition-transform duration-300 ease-in-out transform hover:scale-105"
            [src]="'../../../../assets/images/' + product.product_img"
            [alt]="product.product_name"
            />
          } @placeholder {
            <p>Loading...</p>
          }
        </div>
        <div class="p-4 text-center cursor-pointer" [routerLink]="['/home/product', product.id]" >
          <h5 class="font-semibold">
            <a class="text-black hover:text-black no-underline">{{product.product_name}}</a>
          </h5>
          <p class="text-base font-normal mt-1">{{product.price | currency:'USD'}}</p>
          @if(product.ratings > 0){
            <ng-container>
              <app-ratings [score]="product.ratings"></app-ratings>
            </ng-container>
          }
        </div>
      </div>
    }
  }
</div>
