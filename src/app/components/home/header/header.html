<div
   class="w-full max-w-full min-h-[5rem] shadow-[5px_5px_20px_gray] bg-gray-900 flex items-center px-4"
   >
   <div class="text-white px-3 w-[23%] flex items-center">
      <h1 class="text-3xl font-bold">eStore</h1>
   </div>
   @if(displayOptions()){
   <div
      class="p-0 w-[50%] h-[2.5rem] bg-white flex items-center rounded-md overflow-hidden"
      >
      <select
         #categorySelect
         class="w-auto bg-gray-300 h-full border-none font-semibold px-2 pr-5"
         >
         <option value="" selected disabled>All Categories</option>
         @for(category of categoryStore.topLevelCategories(); track category.id) {
         <option value="{{category.id}}">{{category.category}}</option>
         }
      </select>
      <input
      #keyword
      class="w-full h-full border-none outline-none px-3"
      placeholder="Search..."
      (keydown.enter)="onCategorySelect(categorySelect.value, keyword.value)"
      />
      <button
         (click)="onCategorySelect(categorySelect.value, keyword.value)"
         class="w-[10%] h-full border-none bg-gray-300 flex justify-center items-center"
         >
         <fa-icon [icon]="faSearch"></fa-icon>
      </button>
   </div>
   }@else {
   <div
      class="p-0 w-[50%] h-[2.5rem] flex items-center rounded-md overflow-hidden"
      ></div>
   }
   <div class="flex items-center w-[27%] gap-6 justify-end h-full">
      <div class="flex items-center gap-2 text-white">
         <fa-icon [icon]="faUserCircle" class="text-[1.3em]"></fa-icon>
         <h5>
            <a href="#" class="text-white no-underline hover:underline">Sign in</a>
         </h5>
         <span>/</span>
         <h5>
            <a href="#" class="text-white no-underline hover:underline">Register</a>
         </h5>
      </div>
      <div class="flex items-center gap-4 text-white relative">
         <button 
         (click)="navigateToCart()"
         class="flex items-center justify-center text-white p-2 relative cursor-pointer"
         >
            <fa-icon class="text-[1.3em]" [icon]="faShoppingCart"></fa-icon>
         </button>
         @if(cartStore.cart()){
            @if(cartStore.totalProducts() > 0){
               <span class="absolute -top-1 -right-2 flex justify-center text-[0.7rem] font-semibold text-white bg-amber-500 rounded-full w-5 h-5">
               {{cartStore.totalProducts()}}</span>
            }
         }
      </div>
   </div>
</div>
